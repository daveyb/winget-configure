name: Validate WinGet Configuration

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'winget-packages.yml'
      - 'New-WingetConfiguration.ps1'
      - 'Install-Packages.ps1'
      - 'helpers/**'
      - '.configurations/**'
      - 'tests/**'
      - '.github/workflows/validate-config.yml'
      - '.github/scripts/Test-PackageIds.ps1'
  push:
    branches: [ develop ]
    paths:
      - 'winget-packages.yml'
      - 'New-WingetConfiguration.ps1'
      - 'Install-Packages.ps1'
      - 'helpers/**'
      - '.configurations/**'
      - 'tests/**'
      - '.github/workflows/validate-config.yml'
      - '.github/scripts/Test-PackageIds.ps1'
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate DSC Configuration
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run unit tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Generate configuration.dsc.yaml
        shell: pwsh
        run: |
          .\New-WingetConfiguration.ps1 -Force

      - name: Install WinGet DSC PowerShell Module
        shell: pwsh
        run: |
          $Module = Get-Module -ListAvailable -Name Microsoft.WinGet.DSC
          if (-not $Module) {
            Write-Host "Installing Microsoft.WinGet.DSC module..."
            Install-Module -Name Microsoft.WinGet.DSC -Force -Scope CurrentUser -AllowClobber
          } else {
            Write-Host "Microsoft.WinGet.DSC module is already installed."
          }

      - name: Validate Configuration Schema
        shell: pwsh
        run: |
          winget configure validate -f .configurations/configuration.dsc.yaml --accept-configuration-agreements

      - name: Validate package IDs exist in winget
        shell: pwsh
        run: |
          .\.github\scripts\Test-PackageIds.ps1

      - name: Test Configuration Resolution (Dry-Run)
        shell: pwsh
        run: |
          winget configure test -f .configurations/configuration.dsc.yaml --accept-configuration-agreements --accept-source-agreements
