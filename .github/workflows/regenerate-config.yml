name: Regenerate DSC Configuration

on:
  push:
    branches: [develop]
    paths: [winget-packages.yml]

concurrency:
  group: regenerate-dsc
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate configuration.dsc.yaml
    runs-on: windows-latest

    # Don't run when the push came from this workflow's own PR merge
    if: github.actor != 'github-actions[bot]'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2 # need HEAD~1 for comparison

      - name: Run generator
        shell: pwsh
        run: |
          .\New-WingetConfiguration.ps1 `
            -Force `
            -CompareRef HEAD~1 `
            -ChangesOutputFile changes.json

      - name: Validate generated DSC schema
        shell: pwsh
        run: |
          winget configure validate -f .configurations/configuration.dsc.yaml --accept-configuration-agreements

      - name: Validate package IDs exist in winget
        shell: pwsh
        run: |
          .\.github\scripts\Test-PackageIds.ps1

      - name: Read changes
        id: changes
        shell: pwsh
        run: |
          $changes = Get-Content -Path changes.json -Raw | ConvertFrom-Json

          $added   = @($changes.added)
          $removed = @($changes.removed)
          $pruned  = @($changes.pruned)

          # Build markdown fragments for the CHANGELOG
          $body = ""

          if ($added.Count -gt 0) {
            $body += "### Added`n"
            foreach ($id in $added) {
              $body += "- $id`n"
            }
            $body += "`n"
          }

          if ($removed.Count -gt 0) {
            $body += "### Removed`n"
            foreach ($id in $removed) {
              $body += "- $id`n"
            }
            $body += "`n"
          }

          $hasChanges = ($added.Count -gt 0 -or $removed.Count -gt 0 -or $pruned.Count -gt 0)

          # Write outputs
          "has_changes=$hasChanges" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "added_count=$($added.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "removed_count=$($removed.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "pruned_count=$($pruned.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # Write the changelog body to a temp file (multiline output is tricky)
          $body | Out-File -FilePath changelog_entry.md -Encoding UTF8

      - name: Update CHANGELOG.md
        if: steps.changes.outputs.has_changes == 'True'
        shell: pwsh
        run: |
          $entry = Get-Content -Path changelog_entry.md -Raw
          $changelog = Get-Content -Path CHANGELOG.md -Raw

          # Replace the empty [Unreleased] section with the new content
          # Match "## [Unreleased]" followed by optional whitespace/newlines up to the next "## ["
          $pattern = '(?s)(## \[Unreleased\]\s*?\n)\s*?(?=\n## \[)'
          $replacement = "`$1`n$entry`n"

          if ($changelog -match '## \[Unreleased\]') {
            $updated = $changelog -replace $pattern, $replacement
          } else {
            # If there's no [Unreleased] section, insert one after the header
            $updated = $changelog -replace '(# Changelog.*?\n\n)', "`$1## [Unreleased]`n`n$entry`n"
          }

          Set-Content -Path CHANGELOG.md -Value $updated -Encoding UTF8 -NoNewline

      - name: Check for file changes
        id: diff
        shell: pwsh
        run: |
          git add .configurations/configuration.dsc.yaml CHANGELOG.md
          $diff = git diff --cached --name-only
          if ($diff) {
            "files_changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Changed files:"
            Write-Host $diff
          } else {
            "files_changed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "No file changes detected."
          }

      - name: Commit and push to develop
        if: steps.diff.outputs.files_changed == 'true'
        shell: pwsh
        run: |
          $added   = "${{ steps.changes.outputs.added_count }}"
          $removed = "${{ steps.changes.outputs.removed_count }}"
          $pruned  = "${{ steps.changes.outputs.pruned_count }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Remove temp files — never commit these
          Remove-Item -Path changes.json, changelog_entry.md -ErrorAction SilentlyContinue

          git commit -m "chore: regenerate DSC configuration [skip ci]" `
                     -m "Added: $added package(s), Removed: $removed package(s), Pruned: $pruned tombstone(s)"

          git push origin HEAD:develop
