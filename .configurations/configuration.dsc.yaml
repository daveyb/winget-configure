                  if ($mayDelete)
                  {
                      Remove-Item -LiteralPath $directory -Recurse -Force -ErrorAction SilentlyContinue
                  }
              }
          }
          
          function Set-LockScreenPlayback
          {
              [CmdletBinding()]
              param()
          
              if (Test-LockScreenPlayback)
              {
                  return
              }
          
              if (-not (Test-IsElevatedSession))
              {
                  if ($env:LOCK_SCREEN_PLAYBACK_WORKER -eq '1')
                  {
                      throw 'Lock-screen playback settings require an elevated PowerShell session. Approve the administrator prompt.'
                  }
          
                  Start-LockScreenPlaybackElevated
                  if (-not (Test-LockScreenPlayback))
                  {
                      throw 'Lock-screen playback settings were not applied.'
                  }
                  return
              }
          
              if ((Get-ChromeWindowOcclusionPolicy) -ne 0)
              {
                  Set-ChromeWindowOcclusionPolicy
              }
          
              $timeout = Get-ConsoleLockDisplayOffTimeout
              $timeoutChanged = $false
              $seconds = [string]$script:LockDisplayOffTimeoutSeconds
          
              if ($timeout.AcSeconds -ne $script:LockDisplayOffTimeoutSeconds)
              {
                  $ac = Invoke-PowerCfg -ArgumentList @(
                      '/setacvalueindex', 'SCHEME_CURRENT', $script:VideoSubgroup, $script:ConsoleLockTimeoutGuid, $seconds
                  )
                  if ($ac.ExitCode -ne 0)
                  {
                      throw "powercfg failed to set the AC console lock display timeout (exit $($ac.ExitCode)).`n$($ac.Output)"
                  }
                  $timeoutChanged = $true
              }
          
              if ($timeout.DcSeconds -ne $script:LockDisplayOffTimeoutSeconds)
              {
                  $dc = Invoke-PowerCfg -ArgumentList @(
                      '/setdcvalueindex', 'SCHEME_CURRENT', $script:VideoSubgroup, $script:ConsoleLockTimeoutGuid, $seconds
                  )
                  if ($dc.ExitCode -ne 0)
                  {
                      throw "powercfg failed to set the battery console lock display timeout (exit $($dc.ExitCode)).`n$($dc.Output)"
                  }
                  $timeoutChanged = $true
              }
          
              if ($timeoutChanged)
              {
                  $active = Invoke-PowerCfg -ArgumentList @('/setactive', 'SCHEME_CURRENT')
                  if ($active.ExitCode -ne 0)
                  {
                      throw "powercfg failed to activate the current power scheme (exit $($active.ExitCode)).`n$($active.Output)"
                  }
              }
          
              if (-not (Test-LockScreenPlayback))
              {
                  throw 'Lock-screen playback settings were not applied.'
              }
          }
          return (Test-LockScreenPlayback)
        SetScript: |
          # Lock-screen playback desired state for winget configure.
          #
          # Pocket Casts on this PC is the Chrome app. While the session is locked or
          # the display is off, Chrome marks every window occluded and suspends it,
          # which pauses playback. Chrome policy WindowOcclusionEnabled = 0 disables
          # that detection.
          #
          # The policy is written to HKLM\SOFTWARE\Policies\Google\Chrome in the
          # 64-bit registry view. CreateSubKey creates the Google and Chrome keys
          # when they are missing. The elevated lock-screen process writes that
          # policy. winget configure itself stays a normal window. Chrome applies
          # this machine policy to every user. This script does not remove the value
          # later.
          #
          # VIDEOCONLOCK (8ec4b3a5-6868-48c2-be75-4f3044be88a7) is the console lock
          # display-off timeout, in seconds. This script resets it to 30 seconds on
          # AC and on battery. powercfg /qh is queried for that setting only, and the
          # current AC and DC indexes are the last two hex values in its block.
          #
          # Set shows a User Account Control prompt when the current process is not
          # elevated, then applies the writes from that elevated process. Do not mark
          # this resource securityContext elevated, and do not run the whole
          # winget configure command as Administrator. That fails WinGetPackage with
          # "Failed to create instance." Install-Packages.ps1 catches a dismissed
          # prompt and continues with packages.
          #
          # Chrome must be restarted before an already-open browser picks up the
          # policy. Closing the lid, pressing the power button, or choosing Sleep
          # still stops audio on Windows 11 Modern Standby.
          
          Set-StrictMode -Version Latest
          
          $script:ChromePolicySubKey = 'SOFTWARE\Policies\Google\Chrome'
          $script:ChromePolicyName = 'WindowOcclusionEnabled'
          $script:VideoSubgroup = 'SUB_VIDEO'
          $script:ConsoleLockTimeoutSetting = 'VIDEOCONLOCK'
          $script:ConsoleLockTimeoutGuid = '8ec4b3a5-6868-48c2-be75-4f3044be88a7'
          $script:LockDisplayOffTimeoutSeconds = 30
          
          function Invoke-PowerCfg
          {
              [CmdletBinding()]
              param(
                  [Parameter(Mandatory)]
                  [string[]]$ArgumentList
              )
          
              $saved = $ErrorActionPreference
              $ErrorActionPreference = 'SilentlyContinue'
              $output = & powercfg @ArgumentList 2>&1 | Out-String
              $code = $LASTEXITCODE
              $ErrorActionPreference = $saved
          
              return @{
                  Output   = $output
                  ExitCode = $code
              }
          }
          
          function Get-PowerCfgSettingBlock
          {
              [CmdletBinding()]
              param(
                  [Parameter(Mandatory)]
                  [AllowEmptyString()]
                  [string]$Output,
          
                  [Parameter(Mandatory)]
                  [string]$Alias,
          
                  [Parameter(Mandatory)]
                  [string]$Guid
              )
          
              $lines = @($Output -split '\r?\n')
              $start = -1
              for ($i = 0; $i -lt $lines.Count; $i++)
              {
                  $line = $lines[$i]
                  if ($line -match [regex]::Escape($Guid) -or $line -match ('(?i)\b' + [regex]::Escape($Alias) + '\b'))
                  {
                      $start = $i
                      break
                  }
              }
          
              if ($start -lt 0)
              {
                  return $null
              }
          
              $block = New-Object System.Collections.Generic.List[string]
              $block.Add($lines[$start]) | Out-Null
              for ($j = $start + 1; $j -lt $lines.Count; $j++)
              {
                  $line = $lines[$j]
                  $otherGuid = $line -match '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}'
                  if ($otherGuid -and $line -notmatch [regex]::Escape($Guid))
                  {
                      break
                  }
          
                  $block.Add($line) | Out-Null
              }
          
              return ($block -join "`n")
          }
          
          function Get-ConsoleLockDisplayOffTimeout
          {
              [CmdletBinding()]
              param()
          
              # Ask for VIDEOCONLOCK itself. A subgroup-wide /qh lists other display
              # settings first, and their indexes are not this timeout.
              $query = Invoke-PowerCfg -ArgumentList @(
                  '/qh', 'SCHEME_CURRENT', $script:VideoSubgroup, $script:ConsoleLockTimeoutGuid
              )
              $stdout = [string]$query.Output
              if ($null -eq $query.ExitCode -or $query.ExitCode -ne 0)
              {
                  throw "powercfg /qh failed (exit $($query.ExitCode)).`n$stdout"
              }
          
              $block = Get-PowerCfgSettingBlock -Output $stdout -Alias $script:ConsoleLockTimeoutSetting -Guid $script:ConsoleLockTimeoutGuid
              if ([string]::IsNullOrWhiteSpace($block))
              {
                  throw "powercfg /qh did not include a $($script:ConsoleLockTimeoutSetting) block.`n$stdout"
              }
          
              # Labels are localized. Within this setting the last two hex values are
              # the current AC and DC indexes (earlier values are minimum, maximum,
              # and increment).
              $indexes = @(
                  [regex]::Matches($block, '(?m):\s*0x([0-9A-Fa-f]+)\s*$') |
                      ForEach-Object { [Convert]::ToInt64($_.Groups[1].Value, 16) }
              )
              if ($indexes.Count -lt 2)
              {
                  throw "powercfg /qh $($script:ConsoleLockTimeoutSetting) block has no AC/DC indexes.`n$stdout"
              }
          
              return @{
                  AcSeconds = $indexes[$indexes.Count - 2]
                  DcSeconds = $indexes[$indexes.Count - 1]
                  ExitCode  = $query.ExitCode
              }
          }
          
          function Open-ChromePolicyHive
          {
              [CmdletBinding()]
              param()
          
              return [Microsoft.Win32.RegistryKey]::OpenBaseKey(
                  [Microsoft.Win32.RegistryHive]::LocalMachine,
                  [Microsoft.Win32.RegistryView]::Registry64)
          }
          
          function Get-ChromeWindowOcclusionPolicy
          {
              [CmdletBinding()]
              param()
          
              $base = Open-ChromePolicyHive
              try
              {
                  $key = $base.OpenSubKey($script:ChromePolicySubKey)
                  if ($null -eq $key)
                  {
                      return $null
                  }
          
                  try
                  {
                      $value = $key.GetValue($script:ChromePolicyName, $null)
                      if ($null -eq $value)
                      {
                          return $null
                      }
          
                      return [int]$value
                  }
                  finally
                  {
                      $key.Dispose()
                  }
              }
              finally
              {
                  $base.Dispose()
              }
          }
          
          function Set-ChromeWindowOcclusionPolicy
          {
              [CmdletBinding()]
              param()
          
              $base = Open-ChromePolicyHive
              try
              {
                  # CreateSubKey creates Policies\Google\Chrome when those keys are missing.
                  $key = $base.CreateSubKey($script:ChromePolicySubKey)
                  try
                  {
                      $key.SetValue(
                          $script:ChromePolicyName,
                          0,
                          [Microsoft.Win32.RegistryValueKind]::DWord)
                  }
                  finally
                  {
                      if ($null -ne $key)
                      {
                          $key.Dispose()
                      }
                  }
              }
              finally
              {
                  $base.Dispose()
              }
          }
          
          function Get-LockScreenPlaybackReport
          {
              [CmdletBinding()]
              param()
          
              $occlusionText = 'unset'
              try
              {
                  $occlusion = Get-ChromeWindowOcclusionPolicy
                  if ($null -ne $occlusion)
                  {
                      $occlusionText = [string]$occlusion
                  }
              }
              catch
              {
                  $occlusionText = "error:$($_.Exception.Message)"
              }
          
              $acText = 'unread'
              $dcText = 'unread'
              try
              {
                  $timeout = Get-ConsoleLockDisplayOffTimeout
                  $acText = if ($null -eq $timeout.AcSeconds) { 'unset' } else { [string]$timeout.AcSeconds }
                  $dcText = if ($null -eq $timeout.DcSeconds) { 'unset' } else { [string]$timeout.DcSeconds }
              }
              catch
              {
                  $acText = "error:$($_.Exception.Message)"
                  $dcText = $acText
              }
          
              return @{
                  Result = "occlusion=$occlusionText;acSeconds=$acText;dcSeconds=$dcText"
              }
          }
          
          function Test-LockScreenPlayback
          {
              [CmdletBinding()]
              param()
          
              try
              {
                  if ((Get-ChromeWindowOcclusionPolicy) -ne 0)
                  {
                      return $false
                  }
          
                  $timeout = Get-ConsoleLockDisplayOffTimeout
                  if ($timeout.AcSeconds -ne $script:LockDisplayOffTimeoutSeconds)
                  {
                      return $false
                  }
                  if ($timeout.DcSeconds -ne $script:LockDisplayOffTimeoutSeconds)
                  {
                      return $false
                  }
          
                  return $true
              }
              catch
              {
                  return $false
              }
          }
          
          function Test-IsElevatedSession
          {
              [CmdletBinding()]
              param()
          
              $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
              $principal = New-Object Security.Principal.WindowsPrincipal($identity)
              return $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          }
          
          function Get-LockScreenPlaybackWorkerScript
          {
              [CmdletBinding()]
              param()
          
              $functionNames = @(
                  'Invoke-PowerCfg',
                  'Get-PowerCfgSettingBlock',
                  'Get-ConsoleLockDisplayOffTimeout',
                  'Open-ChromePolicyHive',
                  'Get-ChromeWindowOcclusionPolicy',
                  'Set-ChromeWindowOcclusionPolicy',
                  'Get-LockScreenPlaybackReport',
                  'Test-LockScreenPlayback',
                  'Test-IsElevatedSession',
                  'Set-LockScreenPlayback'
              )
          
              $builder = New-Object System.Text.StringBuilder
              [void]$builder.AppendLine('param([Parameter(Mandatory)][string]$ResultPath)')
              [void]$builder.AppendLine('$ErrorActionPreference = ''Stop''')
              [void]$builder.AppendLine('Set-StrictMode -Version Latest')
              [void]$builder.AppendLine('$env:LOCK_SCREEN_PLAYBACK_WORKER = ''1''')
              [void]$builder.AppendLine("`$script:ChromePolicySubKey = '$($script:ChromePolicySubKey)'")
              [void]$builder.AppendLine("`$script:ChromePolicyName = '$($script:ChromePolicyName)'")
              [void]$builder.AppendLine("`$script:VideoSubgroup = '$($script:VideoSubgroup)'")
              [void]$builder.AppendLine("`$script:ConsoleLockTimeoutSetting = '$($script:ConsoleLockTimeoutSetting)'")
              [void]$builder.AppendLine("`$script:ConsoleLockTimeoutGuid = '$($script:ConsoleLockTimeoutGuid)'")
              [void]$builder.AppendLine("`$script:LockDisplayOffTimeoutSeconds = $($script:LockDisplayOffTimeoutSeconds)")
              foreach ($functionName in $functionNames)
              {
                  $command = Get-Command -Name $functionName -CommandType Function
                  [void]$builder.AppendLine($command.ScriptBlock.Ast.Extent.Text)
                  [void]$builder.AppendLine()
              }
              [void]$builder.AppendLine('try {')
              [void]$builder.AppendLine('    Set-LockScreenPlayback')
              [void]$builder.AppendLine('    if (-not (Test-LockScreenPlayback)) { throw ''Lock-screen playback settings were not applied.'' }')
              [void]$builder.AppendLine('    Set-Content -LiteralPath $ResultPath -Value ''OK'' -Encoding ASCII')
              [void]$builder.AppendLine('    exit 0')
              [void]$builder.AppendLine('}')
              [void]$builder.AppendLine('catch {')
              [void]$builder.AppendLine('    Set-Content -LiteralPath $ResultPath -Value $_.Exception.Message -Encoding ASCII')
              [void]$builder.AppendLine('    exit 1')
              [void]$builder.AppendLine('}')
              return $builder.ToString()
          }
          
          function Get-LockScreenPlaybackHostPath
          {
              [CmdletBinding()]
              param()
          
              # Use the current process only when it is PowerShell. winget configure
              # runs this script in its configuration host, which cannot execute -File.
              $current = $null
              try
              {
                  $current = (Get-Process -Id $PID -ErrorAction Stop).Path
              }
              catch
              {
                  $current = $null
              }
          
              if (-not [string]::IsNullOrWhiteSpace($current))
              {
                  $leaf = [System.IO.Path]::GetFileName($current)
                  if ($leaf -eq 'powershell.exe' -or $leaf -eq 'pwsh.exe')
                  {
                      return $current
                  }
              }
          
              return (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe')
          }
          
          function ConvertTo-LockScreenPlaybackArgument
          {
              [CmdletBinding()]
              param(
                  [Parameter(Mandatory)]
                  [string]$Value
              )
          
              # UseShellExecute takes one command line. Quote every path, including
              # those with no spaces, so TEMP values are not split.
              return '"' + $Value.Replace('"', '""') + '"'
          }
          
          function Read-LockScreenPlaybackResult
          {
              [CmdletBinding()]
              param(
                  [Parameter(Mandatory)]
                  [string]$Path
              )
          
              try
              {
                  if (-not (Test-Path -LiteralPath $Path))
                  {
                      return ''
                  }
          
                  $text = Get-Content -LiteralPath $Path -Raw -ErrorAction SilentlyContinue
              }
              catch
              {
                  return ''
              }
          
              if ($null -eq $text)
              {
                  return ''
              }
          
              return ([string]$text).Trim()
          }
          
          function Start-LockScreenPlaybackElevated
          {
              [CmdletBinding()]
              param()
          
              $directory = Join-Path $env:TEMP ("LockScreenPlayback-" + [guid]::NewGuid().ToString('n'))
              New-Item -ItemType Directory -Path $directory | Out-Null
              $scriptPath = Join-Path $directory 'apply.ps1'
              $resultPath = Join-Path $directory 'result.txt'
              $hostPath = Get-LockScreenPlaybackHostPath
              Set-Content -LiteralPath $scriptPath -Value (Get-LockScreenPlaybackWorkerScript) -Encoding ASCII
          
              # -Verb RunAs forces UseShellExecute. An argument array is split on
              # spaces, and $env:TEMP often contains spaces. Pass one quoted string.
              $arguments = @(
                  '-NoProfile'
                  '-ExecutionPolicy'
                  'Bypass'
                  '-File'
                  (ConvertTo-LockScreenPlaybackArgument $scriptPath)
                  '-ResultPath'
                  (ConvertTo-LockScreenPlaybackArgument $resultPath)
              ) -join ' '
          
              $handleMessage = $null
              $process = $null
              # A RunAs handle often cannot see the elevated process. Do not delete
              # apply.ps1 until that process has written the result file, or the
              # deadline has passed.
              $mayDelete = $false
              try
              {
                  try
                  {
                      $process = Start-Process -FilePath $hostPath -ArgumentList $arguments -Verb RunAs -PassThru
                  }
                  catch
                  {
                      $handleMessage = $_.Exception.Message
                  }
          
                  if ($null -eq $process -and [string]::IsNullOrWhiteSpace($handleMessage))
                  {
                      $handleMessage = 'Lock-screen playback did not start the elevated PowerShell process.'
                  }
          
                  if ($null -eq $process)
                  {
                      # Nothing is writing. A dismissed consent prompt never starts the worker.
                      $mayDelete = $true
                      if ($handleMessage -match 'canceled by the user')
                      {
                          throw 'Lock-screen playback settings require an elevated PowerShell session. Approve the administrator prompt.'
                      }
          
                      throw "Lock-screen playback settings were not applied. $handleMessage"
                  }
          
                  # Poll until the result file is non-empty or the deadline passes.
                  # WaitForExit can return immediately while pwsh is still starting or
                  # still running powercfg. That is not completion and not failure.
                  # Do not read ExitCode.
                  $deadline = [datetime]::UtcNow.AddMinutes(10)
                  $result = ''
                  while ([datetime]::UtcNow -lt $deadline)
                  {
                      $result = Read-LockScreenPlaybackResult -Path $resultPath
                      if (-not [string]::IsNullOrWhiteSpace($result))
                      {
                          break
                      }
          
                      try
                      {
                          # A false early exit must not end the wait, and must not busy-spin.
                          if ($process.WaitForExit(500))
                          {
                              Start-Sleep -Milliseconds 500
                          }
                      }
                      catch
                      {
                          Start-Sleep -Milliseconds 500
                      }
                  }
          
                  if ([string]::IsNullOrWhiteSpace($result))
                  {
                      $result = Read-LockScreenPlaybackResult -Path $resultPath
                  }
          
                  $mayDelete = $true
          
                  if ($result -eq 'OK')
                  {
                      return
                  }
          
                  if ([string]::IsNullOrWhiteSpace($result))
                  {
                      throw 'Lock-screen playback settings were not applied.'
                  }
          
                  throw "Lock-screen playback settings were not applied. $result"
              }
              finally
              {
                  if ($mayDelete)
                  {
                      Remove-Item -LiteralPath $directory -Recurse -Force -ErrorAction SilentlyContinue
                  }
              }
          }
          
          function Set-LockScreenPlayback
          {
              [CmdletBinding()]
              param()
          
              if (Test-LockScreenPlayback)
              {
                  return
              }
          
              if (-not (Test-IsElevatedSession))
              {
                  if ($env:LOCK_SCREEN_PLAYBACK_WORKER -eq '1')
                  {
                      throw 'Lock-screen playback settings require an elevated PowerShell session. Approve the administrator prompt.'
                  }
          
                  Start-LockScreenPlaybackElevated
                  if (-not (Test-LockScreenPlayback))
                  {
                      throw 'Lock-screen playback settings were not applied.'
                  }
                  return
              }
          
              if ((Get-ChromeWindowOcclusionPolicy) -ne 0)
              {
                  Set-ChromeWindowOcclusionPolicy
              }
          
              $timeout = Get-ConsoleLockDisplayOffTimeout
              $timeoutChanged = $false
              $seconds = [string]$script:LockDisplayOffTimeoutSeconds
          
              if ($timeout.AcSeconds -ne $script:LockDisplayOffTimeoutSeconds)
              {
                  $ac = Invoke-PowerCfg -ArgumentList @(
                      '/setacvalueindex', 'SCHEME_CURRENT', $script:VideoSubgroup, $script:ConsoleLockTimeoutGuid, $seconds
                  )
                  if ($ac.ExitCode -ne 0)
                  {
                      throw "powercfg failed to set the AC console lock display timeout (exit $($ac.ExitCode)).`n$($ac.Output)"
                  }
                  $timeoutChanged = $true
              }
          
              if ($timeout.DcSeconds -ne $script:LockDisplayOffTimeoutSeconds)
              {
                  $dc = Invoke-PowerCfg -ArgumentList @(
                      '/setdcvalueindex', 'SCHEME_CURRENT', $script:VideoSubgroup, $script:ConsoleLockTimeoutGuid, $seconds
                  )
                  if ($dc.ExitCode -ne 0)
                  {
                      throw "powercfg failed to set the battery console lock display timeout (exit $($dc.ExitCode)).`n$($dc.Output)"
                  }
                  $timeoutChanged = $true
              }
          
              if ($timeoutChanged)
              {
                  $active = Invoke-PowerCfg -ArgumentList @('/setactive', 'SCHEME_CURRENT')
                  if ($active.ExitCode -ne 0)
                  {
                      throw "powercfg failed to activate the current power scheme (exit $($active.ExitCode)).`n$($active.Output)"
                  }
              }
          
              if (-not (Test-LockScreenPlayback))
              {
                  throw 'Lock-screen playback settings were not applied.'
              }
          }
          Set-LockScreenPlayback

    # -- Shell profile ----------------------------------------------------------------

    - resource: PSDscResources/Script
      id: Shell.Profile
      directives:
        description: Write the PowerShell 7 profile, install Terminal-Icons and Departure Mono, and put PowerShell first in Windows Terminal
        allowPrerelease: true
      settings:
        GetScript: |
          # PowerShell 7 profile, Terminal-Icons, Departure Mono, and Windows Terminal.
          #
          # winget configure can run this file under Windows PowerShell 5.1. $PROFILE
          # and Install-Module in that host are not the PowerShell 7 paths, so a 5.1
          # host relaunches this file with pwsh. Terminal-Icons is installed into the
          # PowerShell 7 CurrentUser module path for the same reason.
          #
          # Fonts are registered for the current user. An elevated DSC securityContext
          # makes every WinGetPackage fail with "The file name is too long."
          #
          # profiles.defaults.font does not replace a font set on a profile. Those
          # per-profile font keys are removed so the default face applies to every
          # profile. defaultProfile is the profile a new tab opens. List order is the
          # dropdown order. PowerShell has to be first in both.
          
          $ErrorActionPreference = 'Stop'
          $script:ShellProfileFile = $MyInvocation.MyCommand.Path
          
          if (($PSVersionTable.PSVersion.Major -lt 7) -and ($MyInvocation.InvocationName -ne '.'))
          {
              $pwshCmd = Get-Command -Name pwsh -ErrorAction Stop
              $output = & $pwshCmd.Source -NoProfile -NonInteractive -File $script:ShellProfileFile
              $code = $LASTEXITCODE
              if ($code -ne 0)
              {
                  exit $code
              }
          
              if ($null -eq $output)
              {
                  return
              }
          
              $lines = @($output | Where-Object { $null -ne $_ -and "$_" -ne '' })
              if ($lines.Count -eq 0)
              {
                  return
              }
              if ($lines.Count -eq 1 -and "$($lines[0])" -eq 'True')
              {
                  return $true
              }
              if ($lines.Count -eq 1 -and "$($lines[0])" -eq 'False')
              {
                  return $false
              }
          
              return $lines
          }
          
          $script:DefaultFontFace = 'DepartureMono Nerd Font'
          $script:FontZipUri = 'https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/DepartureMono.zip'
          $script:PowerShellProfileGuid = '{574e775e-4f2a-5b96-ac1e-a2962a402336}'
          $script:PowerShellProfileSource = 'Windows.Terminal.PowershellCore'
          $script:DepartureMonoFonts = @(
              @{ File = 'DepartureMonoNerdFont-Regular.otf'; Family = 'DepartureMono Nerd Font' }
              @{ File = 'DepartureMonoNerdFontMono-Regular.otf'; Family = 'DepartureMono Nerd Font Mono' }
              @{ File = 'DepartureMonoNerdFontPropo-Regular.otf'; Family = 'DepartureMono Nerd Font Propo' }
          )
          
          function Get-ShellProfileText
          {
              [CmdletBinding()]
              param()
          
              $lines = @(
                  'oh-my-posh --init --shell pwsh --config https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/refs/heads/main/themes/marcduiker.omp.json | Invoke-Expression'
                  ''
                  '# Install-Module -Name Terminal-Icons -Repository PSGallery'
                  'Import-Module -Name Terminal-Icons'
              )
              return (($lines -join "`n") + "`n")
          }
          
          function ConvertTo-NormalizedProfileText
          {
              [CmdletBinding()]
              param([AllowEmptyString()][string]$Text)
          
              if ([string]::IsNullOrEmpty($Text))
              {
                  return "`n"
              }
          
              $normalized = $Text -replace "`r`n", "`n" -replace "`r", "`n"
              return ($normalized.TrimEnd("`n") + "`n")
          }
          
          function Get-UserFontRegistryValueName
          {
              [CmdletBinding()]
              param(
                  [Parameter(Mandatory)][string]$Family,
                  [Parameter(Mandatory)][string]$FileName
              )
          
              $extension = [System.IO.Path]::GetExtension($FileName).ToLowerInvariant()
              $kind = if ($extension -eq '.otf') { 'OpenType' } else { 'TrueType' }
              return ('{0} ({1})' -f $Family, $kind)
          }
          
          function Test-IsWindowsPowerShellProfile
          {
              [CmdletBinding()]
              param(
                  [AllowEmptyString()][string]$Name,
                  [AllowEmptyString()][string]$CommandLine
              )
          
              if ($Name -eq 'Windows PowerShell')
              {
                  return $true
              }
              if ($CommandLine -match '(?i)WindowsPowerShell\\v1\.0\\powershell\.exe')
              {
                  return $true
              }
          
              return $false
          }
          
          function Get-PowerShellProfileRank
          {
              [CmdletBinding()]
              param(
                  [AllowEmptyString()][string]$Name,
                  [AllowEmptyString()][string]$CommandLine,
                  [AllowEmptyString()][string]$Source
              )
          
              if (Test-IsWindowsPowerShellProfile -Name $Name -CommandLine $CommandLine)
              {
                  return -1
              }
          
              $commandIsPwsh = $CommandLine -match '(?i)(^|[\\/\s])pwsh\.exe(\s|$)'
              $sourceIsCore = $Source -eq $script:PowerShellProfileSource
              $nameIsPowerShell = $Name -eq 'PowerShell'
              if (-not ($nameIsPowerShell -or $sourceIsCore -or $commandIsPwsh))
              {
                  return -1
              }
              if ($nameIsPowerShell -and $sourceIsCore)
              {
                  return 0
              }
              if ($nameIsPowerShell)
              {
                  return 1
              }
              if ($sourceIsCore)
              {
                  return 2
              }
          
              return 3
          }
          
          function Get-JsonObjectString
          {
              [CmdletBinding()]
              param(
                  $Object,
                  [Parameter(Mandatory)][string]$Name
              )
          
              if ($null -eq $Object)
              {
                  return ''
              }
          
              $jsonObject = $Object.AsObject()
              if (-not $jsonObject.ContainsKey($Name))
              {
                  return ''
              }
          
              $value = $jsonObject[$Name]
              if ($null -eq $value)
              {
                  return ''
              }
          
              return $value.ToString()
          }
          
          function Remove-JsonObjectKey
          {
              [CmdletBinding()]
              param(
                  $Object,
                  [Parameter(Mandatory)][string]$Name
              )
          
              $jsonObject = $Object.AsObject()
              if ($jsonObject.ContainsKey($Name))
              {
                  [void]$jsonObject.Remove($Name)
              }
          }
          
          function Convert-TerminalSettingsJson
          {
              [CmdletBinding()]
              param([Parameter(Mandatory)][string]$Json)
          
              $documentOptions = [System.Text.Json.JsonDocumentOptions]::new()
              $documentOptions.CommentHandling = [System.Text.Json.JsonCommentHandling]::Skip
              $documentOptions.AllowTrailingCommas = $true
              $nodeOptions = [System.Text.Json.Nodes.JsonNodeOptions]::new()
              $root = [System.Text.Json.Nodes.JsonNode]::Parse($Json, $nodeOptions, $documentOptions)
              if ($null -eq $root -or $root.GetType().Name -ne 'JsonObject')
              {
                  throw 'Windows Terminal settings must be a JSON object.'
              }
          
              $rootObject = $root.AsObject()
              if (-not $rootObject.ContainsKey('profiles') -or $null -eq $rootObject['profiles'])
              {
                  $rootObject['profiles'] = [System.Text.Json.Nodes.JsonObject]::new()
              }
          
              $profiles = $rootObject['profiles'].AsObject()
              if (-not $profiles.ContainsKey('defaults') -or $null -eq $profiles['defaults'])
              {
                  $profiles['defaults'] = [System.Text.Json.Nodes.JsonObject]::new()
              }
          
              $defaults = $profiles['defaults'].AsObject()
              Remove-JsonObjectKey -Object $defaults -Name 'fontFace'
              if (-not $defaults.ContainsKey('font') -or $null -eq $defaults['font'] -or $defaults['font'].GetType().Name -ne 'JsonObject')
              {
                  $defaults['font'] = [System.Text.Json.Nodes.JsonObject]::new()
              }
              $defaults['font'].AsObject()['face'] = $script:DefaultFontFace
          
              if (-not $profiles.ContainsKey('list') -or $null -eq $profiles['list'] -or $profiles['list'].GetType().Name -ne 'JsonArray')
              {
                  $profiles['list'] = [System.Text.Json.Nodes.JsonArray]::new()
              }
          
              $list = $profiles['list'].AsArray()
              $bestIndex = -1
              $bestRank = 99
              for ($index = 0; $index -lt $list.Count; $index++)
              {
                  $name = Get-JsonObjectString -Object $list[$index] -Name 'name'
                  $commandLine = Get-JsonObjectString -Object $list[$index] -Name 'commandline'
                  $source = Get-JsonObjectString -Object $list[$index] -Name 'source'
                  $rank = Get-PowerShellProfileRank -Name $name -CommandLine $commandLine -Source $source
                  if ($rank -ge 0 -and $rank -lt $bestRank)
                  {
                      $bestRank = $rank
                      $bestIndex = $index
                  }
              }
          
              if ($bestIndex -lt 0)
              {
                  $created = [System.Text.Json.Nodes.JsonObject]::new()
                  $created['guid'] = $script:PowerShellProfileGuid
                  $created['hidden'] = [System.Text.Json.Nodes.JsonValue]::Create($false)
                  $created['name'] = 'PowerShell'
                  $created['source'] = $script:PowerShellProfileSource
                  $list.Insert(0, $created)
                  $chosen = $created
              }
              else
              {
                  $chosen = $list[$bestIndex]
                  if ($bestIndex -ne 0)
                  {
                      $list.RemoveAt($bestIndex)
                      $list.Insert(0, $chosen)
                  }
              }
          
              $chosenObject = $chosen.AsObject()
              $guid = Get-JsonObjectString -Object $chosenObject -Name 'guid'
              if ([string]::IsNullOrWhiteSpace($guid))
              {
                  $guid = $script:PowerShellProfileGuid
                  $chosenObject['guid'] = $guid
              }
              $chosenObject['hidden'] = [System.Text.Json.Nodes.JsonValue]::Create($false)
              $rootObject['defaultProfile'] = $guid
          
              foreach ($item in @($list))
              {
                  Remove-JsonObjectKey -Object $item -Name 'font'
                  Remove-JsonObjectKey -Object $item -Name 'fontFace'
              }
          
              $serializerOptions = [System.Text.Json.JsonSerializerOptions]::new()
              $serializerOptions.WriteIndented = $true
              $indentSize = $serializerOptions.PSObject.Properties['IndentSize']
              if ($null -ne $indentSize)
              {
                  $serializerOptions.IndentSize = 4
              }
          
              $encoderType = 'System.Text.Encodings.Web.JavaScriptEncoder' -as [type]
              if ($null -ne $encoderType)
              {
                  $serializerOptions.Encoder = $encoderType::UnsafeRelaxedJsonEscaping
              }
          
              $text = $root.ToJsonString($serializerOptions)
              $text = $text.Replace("`n", "`r`n").Replace("`r`r`n", "`r`n")
              if (-not $text.EndsWith("`r`n"))
              {
                  $text += "`r`n"
              }
          
              return $text
          }
          
          function Test-TerminalSettingsText
          {
              [CmdletBinding()]
              param([AllowEmptyString()][string]$Json)
          
              if ([string]::IsNullOrWhiteSpace($Json))
              {
                  return $false
              }
          
              try
              {
                  $updated = Convert-TerminalSettingsJson -Json $Json
                  $currentFacts = Get-TerminalSettingsFacts -Json $Json
                  $updatedFacts = Get-TerminalSettingsFacts -Json $updated
                  return ($currentFacts -eq $updatedFacts)
              }
              catch
              {
                  return $false
              }
          }
          
          function Get-TerminalSettingsFacts
          {
              [CmdletBinding()]
              param([Parameter(Mandatory)][string]$Json)
          
              $documentOptions = [System.Text.Json.JsonDocumentOptions]::new()
              $documentOptions.CommentHandling = [System.Text.Json.JsonCommentHandling]::Skip
              $documentOptions.AllowTrailingCommas = $true
              $nodeOptions = [System.Text.Json.Nodes.JsonNodeOptions]::new()
              $root = [System.Text.Json.Nodes.JsonNode]::Parse($Json, $nodeOptions, $documentOptions).AsObject()
              $profiles = $root['profiles'].AsObject()
              $defaults = $profiles['defaults'].AsObject()
              $face = ''
              if ($defaults.ContainsKey('font') -and $null -ne $defaults['font'])
              {
                  $face = Get-JsonObjectString -Object $defaults['font'] -Name 'face'
              }
          
              $list = $profiles['list'].AsArray()
              $firstName = ''
              $firstGuid = ''
              $firstSource = ''
              $firstCommand = ''
              $firstHidden = ''
              $profileFontCount = 0
              if ($list.Count -gt 0)
              {
                  $firstName = Get-JsonObjectString -Object $list[0] -Name 'name'
                  $firstGuid = Get-JsonObjectString -Object $list[0] -Name 'guid'
                  $firstSource = Get-JsonObjectString -Object $list[0] -Name 'source'
                  $firstCommand = Get-JsonObjectString -Object $list[0] -Name 'commandline'
                  $firstObject = $list[0].AsObject()
                  if ($firstObject.ContainsKey('hidden'))
                  {
                      $firstHidden = $firstObject['hidden'].ToString().ToLowerInvariant()
                  }
                  foreach ($item in @($list))
                  {
                      $itemObject = $item.AsObject()
                      if ($itemObject.ContainsKey('font') -or $itemObject.ContainsKey('fontFace'))
                      {
                          $profileFontCount++
                      }
                  }
              }
          
              $defaultProfile = Get-JsonObjectString -Object $root -Name 'defaultProfile'
              $defaultFontFace = ''
              if ($defaults.ContainsKey('fontFace'))
              {
                  $defaultFontFace = Get-JsonObjectString -Object $defaults -Name 'fontFace'
              }
          
              return ('face={0};defaultFontFace={1};first={2};guid={3};source={4};command={5};hidden={6};defaultProfile={7};profileFonts={8}' -f $face, $defaultFontFace, $firstName, $firstGuid, $firstSource, $firstCommand, $firstHidden, $defaultProfile, $profileFontCount)
          }
          
          function Get-PwshProfilePath
          {
              [CmdletBinding()]
              param()
          
              $pwshCmd = Get-Command -Name pwsh -ErrorAction SilentlyContinue
              if ($pwshCmd)
              {
                  $output = & $pwshCmd.Source -NoProfile -NonInteractive -Command '$PROFILE.CurrentUserCurrentHost'
                  if ($LASTEXITCODE -eq 0 -and $output)
                  {
                      $path = @($output)[-1]
                      if ($path)
                      {
                          return $path.ToString().Trim()
                      }
                  }
              }
          
              return (Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell\Microsoft.PowerShell_profile.ps1')
          }
          
          function Test-PwshProfileContent
          {
              [CmdletBinding()]
              param()
          
              $path = Get-PwshProfilePath
              if (-not (Test-Path -LiteralPath $path))
              {
                  return $false
              }
          
              $current = [System.IO.File]::ReadAllText($path)
              $desired = Get-ShellProfileText
              return ((ConvertTo-NormalizedProfileText $current) -eq (ConvertTo-NormalizedProfileText $desired))
          }
          
          function Set-PwshProfileContent
          {
