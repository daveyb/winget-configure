          function Test-WindowsTerminalSettings
          {
              [CmdletBinding()]
              param()
          
              $paths = @(Get-ExistingWindowsTerminalSettingsPaths)
              if ($paths.Count -eq 0)
              {
                  return $false
              }
          
              foreach ($path in $paths)
              {
                  $json = [System.IO.File]::ReadAllText($path)
                  if (-not (Test-TerminalSettingsText -Json $json))
                  {
                      return $false
                  }
