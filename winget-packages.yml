# winget-packages.yml
# Curated list of packages to install via Windows Package Manager (winget).
# All categories are merged at generation time — grouping is purely for organisation.
#
# This file is the SINGLE SOURCE OF TRUTH for the package list.
# Edit packages here, then regenerate the DSC configuration:
#
#   .\New-WingetConfiguration.ps1             # regenerate .configurations\configuration.dsc.yaml
#   .\New-WingetConfiguration.ps1 -Force      # regenerate without prompting
#
# Then apply the configuration idempotently:
#
#   winget configure -f .configurations\configuration.dsc.yaml

packages:
  # ── Development tools & languages ────────────────────────────────────────────
  development:
    - Git.Git # Git version control
    - GitHub.cli # GitHub CLI (gh)
    - GitHub.Copilot # GitHub Copilot CLI extension
    - GitHub.CopilotApp
    - GoLang.Go # Go programming language
    - Python.Python.3.14 # Python 3.14
    - ZedIndustries.Zed # Zed code editor
    - Microsoft.PowerShell # PowerShell 7+
    - Microsoft.WindowsTerminal # Windows Terminal
    - JanDeDobbeleer.OhMyPosh # Oh My Posh prompt theme engine
    - OpenJS.NodeJS
    - Anthropic.ClaudeCode
    - Google.Antigravity
    - xAI.GrokBuild # Grok Build CLI agent
    - Google.AndroidStudio
    - Hashicorp.TerraformLanguageServer

  # ── Cloud & infrastructure ────────────────────────────────────────────────────
  cloud_infrastructure:
    - Microsoft.AzureCLI # Azure CLI
    - Hashicorp.Terraform # Terraform IaC
    - Terraform-docs.Terraform-docs # terraform-docs
    - Kubernetes.kubectl # kubectl
    - Derailed.k9s # k9s – Kubernetes TUI
    - Microsoft.FoundryLocal # Azure AI Foundry Local

  # ── Containers & virtualization ──────────────────────────────────────────────
  containers_virtualization:
    - Microsoft.WSL # Windows Subsystem for Linux
    - LinuxContainers.Incus # Incus system container manager
    #- Canonical.Ubuntu.2604 # Ubuntu 26.04 LTS (WSL distro)
    - Docker.DockerDesktop # Docker Desktop

  # ── Productivity ──────────────────────────────────────────────────────────────
  productivity:
    - Microsoft.PowerToys # Windows PowerToys
    - Microsoft.Sysinternals.Suite # Sysinternals Suite
    - Microsoft.Teams # Microsoft Teams
    - Microsoft.Office # Microsoft 365 / Office
    - calibre.calibre # Calibre e-book manager
    - Tailscale.Tailscale # Tailscale VPN mesh
    - Proton.ProtonVPN # Proton VPN
    - JAMSoftware.TreeSize.Free
    - Google.GoogleDrive
    - JGraph.Draw # Draw.io diagramming tool

  # ── Media & entertainment ─────────────────────────────────────────────────────
  media_entertainment:
    - Spotify.Spotify # Spotify music streaming
    - VideoLAN.VLC # VLC media player
    - GuinpinSoft.MakeMKV # MakeMKV disc ripper
    - Gyan.FFmpeg # FFmpeg multimedia framework
    - Valve.Steam # Steam gaming platform
    - GOG.Galaxy
    - martinrotter.RSSGuard5

  # ── Data science & ML ─────────────────────────────────────────────────────────
  data_science:
    - astral-sh.uv # uv – fast Python package manager

  # ── Browsers ──────────────────────────────────────────────────────────────────
  browsers:
    - Mozilla.Firefox
    - Google.Chrome

  # ── Communication ─────────────────────────────────────────────────────────────
  communication:
    - Zoom.Zoom # Zoom video conferencing
    - Telegram.TelegramDesktop
    - Element.Element

  # ── 3D printing ───────────────────────────────────────────────────────────────

  # ── Security ───────────────────────────────────────────────────────────────────
  security:
    - Proton.ProtonPass.CLI
